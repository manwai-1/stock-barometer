name: Daily Barometer Data Sync

on:
  schedule:
    # 每天美東時間 17:30 (即 UTC 21:30) 自動執行一次
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 後台點按鈕手動觸發

permissions:
  contents: write # 賦予寫入與自動 Commit 權限

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Run data update script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git commit -m "chore: auto-update barometer metrics [skip ci]" || exit 0
          git push